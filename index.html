<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>angry-pigs</title>
  <style>
    /* Inline so the single-file release artifact needs no external requests. */
    :root { --bg: #08090c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #app { position: relative; width: 100%; max-width: 100%; }
    #stage {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      margin: 0 auto;
      touch-action: none; /* pointer drag must not scroll the page */
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 12px 16px;
      font: 600 14px/1.4 ui-monospace, monospace;
      color: #6ef3ff;
      letter-spacing: 0.08em;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #hud .hud-row { display: flex; gap: 16px; }
    #hud .hud-message { min-height: 1.4em; }
    #hud .hud-actions { display: flex; gap: 10px; }
    #hud .hud-restart, #hud .hud-menu {
      pointer-events: auto;
      align-self: flex-start;
      background: transparent;
      border: 1px solid #6ef3ff;
      color: #6ef3ff;
      font: 600 12px/1 ui-monospace, monospace;
      letter-spacing: 0.1em;
      padding: 6px 10px;
      cursor: pointer;
    }
    #hud .hud-restart:hover, #hud .hud-menu:hover { background: rgba(110, 243, 255, 0.12); }

    /* Title + options overlays (M19). DOM chrome over the canvas; hidden by default
       so the release artifact needs no script to show the game. */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8, 9, 12, 0.86);
      font: 600 14px/1.5 ui-monospace, monospace;
      color: #6ef3ff;
      letter-spacing: 0.08em;
    }
    .overlay .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px 26px;
      border: 1px solid #6ef3ff;
      background: rgba(8, 9, 12, 0.6);
      max-width: 460px;
    }
    .overlay .overlay-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .overlay .stage-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .overlay .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .overlay .opt-row { display: flex; gap: 12px; align-items: center; }
    .overlay .opt-row span { min-width: 72px; opacity: 0.75; }
    .overlay-actions { display: flex; gap: 12px; margin-top: 6px; }
    .overlay-button {
      background: transparent;
      border: 1px solid #6ef3ff;
      color: #6ef3ff;
      font: 600 12px/1 ui-monospace, monospace;
      letter-spacing: 0.1em;
      padding: 8px 12px;
      cursor: pointer;
    }
    .overlay-button:hover { background: rgba(110, 243, 255, 0.12); }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="stage" width="1600" height="900"></canvas>
    <div id="hud"></div>
  </div>

  <!-- Entry: dev loads the bundle file; `npm run build` inlines it into dist/index.html -->
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
