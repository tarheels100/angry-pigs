<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>angry-pigs</title>
  <style>
    /* Inline so the single-file artifact needs no extra request. */
    html, body { margin: 0; background: #04060d; color: #cfe9f5; font-family: ui-monospace, monospace; }
    #app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    /* The canvas keeps the world's 16:9 shape and shrinks so the HUD stays on screen —
     * a restart button below the fold is unreachable on a short window. */
    canvas {
      /* Fill the space under the HUD and let the camera letterbox the level inside it.
       * Constraining the canvas to a 16:9 box made the stage tiny on short or portrait
       * windows; the camera fit already guarantees the whole level is visible. */
      width: 100%;
      height: calc(100vh - 56px);
      background: #04060d;
      touch-action: none;
    }
    #hud { width: 100%; display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
    #hud span { white-space: nowrap; }
    #hud button { color: inherit; background: none; border: 1px solid currentColor; font: inherit; padding: 4px 10px; cursor: pointer; }
    #hud button:hover { background: rgba(110, 243, 255, 0.12); }

    /* Menu overlays are built by src/ui/screens.ts and appended to #app; the loop is
     * paused while one is open (docs/adr.md D35). */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 13, 0.82);
    }
    .panel {
      width: min(560px, 92%);
      border: 1px solid rgba(110, 243, 255, 0.5);
      background: rgba(6, 12, 20, 0.92);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .overlay-title {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0.2em;
      color: #6ef3ff;
      font-weight: 400;
    }
    .overlay-button {
      color: #cfe9f5;
      background: none;
      border: 1px solid rgba(110, 243, 255, 0.35);
      font: inherit;
      padding: 7px 12px;
      text-align: left;
      cursor: pointer;
    }
    .overlay-button:hover { background: rgba(110, 243, 255, 0.12); }
    .stage-list, .opt-list, .overlay-actions { display: flex; flex-direction: column; gap: 6px; }
    .stage-list { list-style: none; margin: 0; padding: 0; }
    .opt-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .opt-row button { text-align: right; }

    /* Level editor (M23). A floating panel rather than a full overlay: a press on the
     * canvas still reaches the game, which is how pieces get placed. */
    .editor-panel {
      position: absolute;
      left: 12px;
      top: 12px;
      width: 320px;
      max-height: calc(100% - 24px);
      overflow: auto;
      display: none;
      flex-direction: column;
      gap: 6px;
      border: 1px solid rgba(110, 243, 255, 0.5);
      background: rgba(6, 12, 20, 0.92);
      padding: 12px;
      font-size: 12px;
      z-index: 3;
    }
    .editor-title { color: #6ef3ff; letter-spacing: 0.15em; }
    .editor-palette, .editor-actions, .editor-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .editor-pieces { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow: auto; }
    .editor-panel button {
      color: #cfe9f5;
      background: none;
      border: 1px solid rgba(110, 243, 255, 0.3);
      font: inherit;
      padding: 4px 8px;
      cursor: pointer;
      text-align: left;
    }
    .editor-panel button:hover { background: rgba(110, 243, 255, 0.12); }
    .editor-arm.is-active, .editor-piece.is-selected { background: rgba(110, 243, 255, 0.18); border-color: #6ef3ff; }
    .editor-delete { color: #ff7a7a; border-color: rgba(255, 122, 122, 0.4); }
    .editor-error { color: #ff7a7a; }
    .editor-warning { color: #ffd28a; }
    .editor-ok { color: #7fd6a0; }
    .editor-hint, .editor-empty, .editor-selected { color: #8fb6c8; }
    .editor-export {
      width: 100%;
      background: rgba(4, 6, 13, 0.6);
      color: #cfe9f5;
      border: 1px solid rgba(110, 243, 255, 0.3);
      font: inherit;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="stage" width="1600" height="900"></canvas>
    <div id="hud"></div>
  </div>

  <!-- Entry: dev loads the bundle file; `npm run build` inlines it into dist/index.html -->
  <script src="./dist/main.js"></script>
</body>
</html>
