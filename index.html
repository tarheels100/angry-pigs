<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>angry-pigs</title>
  <style>
    /* Inline so the single-file release artifact needs no external requests. */
    :root { --bg: #08090c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #app { position: relative; width: 100%; max-width: 100%; }
    #stage {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      margin: 0 auto;
      touch-action: none; /* pointer drag must not scroll the page */
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 12px 16px;
      font: 600 14px/1.4 ui-monospace, monospace;
      color: #6ef3ff;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="stage" width="1600" height="900"></canvas>
    <div id="hud"></div>
  </div>

  <!-- Entry: dev loads the bundle file; `npm run build` inlines it into dist/index.html -->
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
